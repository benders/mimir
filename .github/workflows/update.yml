# Unattended data updates and site deploys (issue #2). Only the public Steam branch is tracked.
#
#   poll    steamcmd: current Steam build id vs data/meta.json steamBuildId (pushes take meta's: deploy only)
#   update  if it changed: download server, dump, icons, normalize, verify, build site, renders, check the game code
#           the mechanics pages cite (#60); commit data/ and site/mechanics/verified.json
#   site    build the site from data/ + icons + location renders (from the cache, or re-extracted on a miss)
#
# Renders (#52, #53) are cached per build id and renderer version (extract-renders.py + requirements.txt), so a
# renderer change re-renders on its next deploy. They are optional: a failed render run leaves the site without
# thumbnails (with a warning) rather than blocking the data update or the deploy.
#   deploy  publish to GitHub Pages; record a New Relic change tracking marker on the Browser app (#50)
#
# The marker needs the NEW_RELIC_API_KEY secret (a User key, on the github-pages environment only) and the
# NEW_RELIC_ENTITY_GUID variable; without the secret the step is skipped, and it can never fail a deploy.
#
# Schedules stop after 60 days without repo activity (GitHub emails first); re-enable in the Actions tab.
name: update

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Re-extract even if the Steam build id is unchanged
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [data/**, site/**, scripts/build-site.py, scripts/well.py, scripts/extract-renders.py, requirements.txt,
            .github/workflows/update.yml]

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.poll.outputs.build }}
      changed: ${{ steps.poll.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - id: poll
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          have="$(python3 -c 'import json; print(json.load(open("data/meta.json")).get("steamBuildId", ""))')"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            build="$have"  # a push redeploys committed data/; no steamcmd (Docker) needed
          else
            build="$(make -s buildid)"
          fi
          changed=false
          if [[ "$build" != "$have" || "$FORCE" == true ]]; then changed=true; fi
          echo "build=$build" >>"$GITHUB_OUTPUT"
          echo "changed=$changed" >>"$GITHUB_OUTPUT"
          echo "Steam build **$build**, data/ has **${have:-none}** → update: $changed" >>"$GITHUB_STEP_SUMMARY"

  update:
    needs: poll
    if: needs.poll.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write  # mechanics sources check
    steps:
      - uses: actions/checkout@v7
      - name: Extract, normalize, verify, build site
        env:
          MIMIR_STEAM_BUILDID: ${{ needs.poll.outputs.build }}
        run: make check-local
      # Mechanics pages (#60): pages whose cited methods are unchanged move to the new version in
      # site/mechanics/verified.json; changed ones are flagged on the site and get an issue. Never blocks the update.
      - name: Check mechanics sources
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.poll.outputs.build }}
        run: |
          make decompile >&2
          scripts/mechanics_sources.py check >.cache/mechanics-report.md
          if [[ ! -s .cache/mechanics-report.md ]]; then
            echo "Mechanics pages: the game code they cite is unchanged" >>"$GITHUB_STEP_SUMMARY"; exit 0
          fi
          echo "::warning::game code cited by mechanics pages changed; see the job summary"
          cat .cache/mechanics-report.md >>"$GITHUB_STEP_SUMMARY"
          version="$(python3 -c 'import json; print(json.load(open("data/meta.json"))["gameVersion"])')"
          if [[ -z "$(gh issue list --state all --label mechanics --search "\"build $BUILD\" in:title" --json number -q '.[].number')" ]]; then
            gh issue create --label mechanics --body-file .cache/mechanics-report.md \
              --title "Mechanics: cited game code changed in Valheim $version (build $BUILD)"
          fi
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: |
            .cache/dump/public/server.log
            .cache/dump/public/bepinex.log
            .cache/dump/public/raw/manifest.json
          if-no-files-found: ignore
      - name: Cache icons
        uses: actions/cache/save@v6
        with:
          path: .cache/dump/public/icons
          key: icons-${{ needs.poll.outputs.build }}
      - name: Render locations
        id: renders
        continue-on-error: true
        env:
          MIMIR_RENDER_THREADS: 4  # the runner's cores; about 4 GB peak instead of 5
        run: make test-renders renders
      - name: Warn on failed renders
        if: steps.renders.outcome == 'failure'
        run: echo "::warning::location renders failed; the site deploys without thumbnails"
      - name: Cache renders
        if: steps.renders.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .cache/dump/public/renders
          key: renders-${{ needs.poll.outputs.build }}-${{ hashFiles('scripts/extract-renders.py', 'requirements.txt') }}
      - name: Commit data/
        env:
          BUILD: ${{ needs.poll.outputs.build }}
        run: |
          git add data site/mechanics/verified.json
          if git diff --cached --quiet; then echo "data/ unchanged"; exit 0; fi
          version="$(python3 -c 'import json; print(json.load(open("data/meta.json"))["gameVersion"])')"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Data: Valheim $version (Steam build $BUILD)"
          git pull -q --rebase origin "$GITHUB_REF_NAME"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
          git diff --stat HEAD~1 -- data >>"$GITHUB_STEP_SUMMARY"

  site:
    needs: [poll, update]
    # After an update; on pushes and manual runs even without one. Scheduled no-op polls deploy nothing.
    if: >-
      always() && needs.poll.result == 'success' &&
      (needs.update.result == 'success' || (needs.update.result == 'skipped' && github.event_name != 'schedule'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}  # includes the data commit just pushed by update
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - id: icons
        uses: actions/cache/restore@v6
        with:
          path: .cache/dump/public/icons
          key: icons-${{ needs.poll.outputs.build }}
      - id: renders
        uses: actions/cache/restore@v6
        with:
          path: .cache/dump/public/renders
          key: renders-${{ needs.poll.outputs.build }}-${{ hashFiles('scripts/extract-renders.py', 'requirements.txt') }}
      # Renders need the raw dump and the server download too, so a miss on either re-extracts.
      - name: Re-extract (cache miss)
        if: steps.icons.outputs.cache-hit != 'true' || steps.renders.outputs.cache-hit != 'true'
        run: make extract
      - name: Save icons
        if: steps.icons.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/dump/public/icons
          key: icons-${{ needs.poll.outputs.build }}
      - name: Render locations (cache miss)
        id: render
        if: steps.renders.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          MIMIR_RENDER_THREADS: 4  # the runner's cores; about 4 GB peak instead of 5
        run: make test-renders renders
      - name: Warn on failed renders
        if: steps.render.outcome == 'failure'
        run: echo "::warning::location renders failed; the site deploys without thumbnails"
      - name: Save renders
        if: steps.render.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .cache/dump/public/renders
          key: renders-${{ needs.poll.outputs.build }}-${{ hashFiles('scripts/extract-renders.py', 'requirements.txt') }}
      - run: make site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .cache/site/public

  deploy:
    needs: [poll, update, site]
    if: always() && needs.site.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      NEW_RELIC: ${{ secrets.NEW_RELIC_API_KEY != '' }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
      # New Relic change tracking marker: a game update (update committed data/) or a site deploy.
      - uses: actions/checkout@v7
        if: env.NEW_RELIC == 'true'
        continue-on-error: true
        with:
          ref: ${{ needs.site.outputs.sha }}
          fetch-depth: 2
      - id: marker
        if: env.NEW_RELIC == 'true'
        continue-on-error: true
        env:
          UPDATED: ${{ needs.update.result == 'success' }}
          BUILD: ${{ needs.poll.outputs.build }}
        run: |
          if [[ "$UPDATED" == true ]]; then
            game="$(python3 -c 'import json; print(json.load(open("data/meta.json"))["gameVersion"])')"
            version="Valheim $game (Steam build $BUILD)"
            description="Game update: Valheim $game (build $BUILD)"
            if [[ "$(git log -1 --format=%s)" == "Data: "* ]]; then
              changelog="$(git diff --stat HEAD~1 HEAD -- data)"
            else
              changelog="data/ unchanged"
            fi
          else
            version="$(git rev-parse --short HEAD)"
            description="Site deploy"
            changelog="$(git log -1 --format=%B)"
          fi
          {
            echo "version=$version"
            echo "description=$description"
            echo "changelog<<MIMIR_EOF"
            echo "$changelog"
            echo "MIMIR_EOF"
          } >>"$GITHUB_OUTPUT"
      - id: newrelic
        if: env.NEW_RELIC == 'true' && steps.marker.outcome == 'success'
        continue-on-error: true
        uses: newrelic/deployment-marker-action@d88a59ea8f713ad6935e60de27273157790b1e3b  # v2.6.2
        with:
          apiKey: ${{ secrets.NEW_RELIC_API_KEY }}
          guid: ${{ vars.NEW_RELIC_ENTITY_GUID }}
          region: US
          version: ${{ steps.marker.outputs.version }}
          description: ${{ steps.marker.outputs.description }}
          changelog: ${{ steps.marker.outputs.changelog }}
          commit: ${{ needs.site.outputs.sha }}
          user: ${{ github.actor }}
          deeplink: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Marker summary
        if: env.NEW_RELIC == 'true'
        env:
          ID: ${{ steps.newrelic.outputs.deploymentId }}
          VERSION: ${{ steps.marker.outputs.version }}
        run: |
          if [[ -n "$ID" ]]; then
            echo "New Relic marker **$VERSION** ($ID)" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::New Relic change tracking marker not recorded"
          fi
